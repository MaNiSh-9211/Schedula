apiVersion: v1
kind: Secret
metadata:
  name: schedula-secrets
  namespace: schedula
type: Opaque
stringData:
  # replace with real values via `kubectl create secret` in production
  SCHEDULA_DB_PASSWORD: "change-me"
  SCHEDULA_ADMIN_KEY: "change-me-admin"
  SCHEDULA_DEFAULT_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schedula-config
  namespace: schedula
data:
  SCHEDULA_DB_URL: "jdbc:postgresql://postgres.schedula.svc.cluster.local:5432/schedula"
  SCHEDULA_DB_USER: "schedula"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
