<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedula - Distributed Job Scheduler</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--purple:#bc8cff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 0;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header-inner h1{font-size:18px;display:flex;align-items:center;gap:8px}
.header-inner h1 img{border-radius:6px}
nav.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav.tabs a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;font-size:13px}
nav.tabs a.active{color:var(--text);background:var(--bg);border:1px solid var(--border)}
.header-keys{display:flex;gap:6px;align-items:center}
.header-keys input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;width:180px}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.danger{background:#da3633;border-color:#da3633;color:#fff}
.btn.warn{background:#bb8009;border-color:#bb8009;color:#fff}
.btn-xs{padding:2px 8px;font-size:11px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
.btn-xs:hover{border-color:var(--accent)}
.btn-xs.danger{color:var(--bad);border-color:var(--bad)}
.btn-xs.warn{color:var(--warn);border-color:var(--warn)}
main{padding:20px 0}
.view{display:none}.view.active{display:block}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar h2{font-size:16px}
.toolbar-right{display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
th{background:#1c2128;color:var(--muted);font-weight:500}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.s-completed,.s-succeeded{background:#0d4429;color:var(--ok)}
.s-running{background:#0c2d6b;color:var(--accent)}
.s-dead,.s-failed,.s-failed_terminal,.s-failed_permanent{background:#490202;color:var(--bad)}
.s-queued,.s-scheduled,.s-dispatched,.s-retry_wait,.s-cancelling,.s-paused,.s-blocked{background:#3d2e00;color:var(--warn)}
.s-cancelled,.s-abandoned{background:#3d1e1e;color:var(--muted)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,monospace}.small{font-size:12px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal-content h3{margin-bottom:16px}
.modal-content label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted)}
.modal-content input,.modal-content textarea,.modal-content select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px}
.modal-content textarea{min-height:80px;font-family:ui-monospace,monospace}
.modal-content .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px}
.card b{display:block;font-size:22px}
.card span{color:var(--muted);font-size:12px}
pre.mono{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;font-size:12px;white-space:pre-wrap}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.detail-grid pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;overflow-x:auto}
.detail-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.detail-table th,.detail-table td{padding:4px 8px;border:1px solid var(--border);text-align:left}
.detail-table th{background:#1c2128}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.metric-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.metric-card h3{font-size:11px;color:var(--muted);font-weight:400;margin-bottom:4px}
.metric-value{font-size:20px;font-weight:700}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
#toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:6px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px}
.toast.error{border-color:var(--bad);color:var(--bad)}
.toast.success{border-color:var(--ok);color:var(--ok)}
.section-title{font-size:14px;font-weight:600;margin:20px 0 8px;color:var(--text)}
</style>
</head>
<body>
<header><div class="container header-inner">
<h1><img src="/favicon.svg" width="28" height="28" alt="S"> Schedula</h1>
<nav class="tabs" id="main-nav">
<a href="#dashboard" class="active" data-view="dashboard">Dashboard</a>
<a href="#jobs" data-view="jobs">Jobs</a>
<a href="#workflows" data-view="workflows">Workflows</a>
<a href="#schedules" data-view="schedules">Schedules</a>
<a href="#dlq" data-view="dlq">DLQ</a>
<a href="#fleet" data-view="fleet">Fleet</a>
<a href="#fingerprints" data-view="fingerprints">Fingerprints</a>
<a href="#analytics" data-view="analytics">Analytics</a>
<a href="#admin" data-view="admin">Admin</a>
</nav>
<div class="header-keys">
<input id="in-api-key" placeholder="API Key" value="sk_00000000-0000-0000-0000-000000000001_devkey123">
<input id="in-admin-key" placeholder="Admin Key">
<button class="btn primary" onclick="saveKeys()">Go</button>
</div>
</div></header>
<main class="container" id="main-content"></main>
<div id="modal-root"></div>
<div id="toast-container"></div>
<script src="/app.js"></script>
</body>
</html>
