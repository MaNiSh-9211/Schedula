spring:
  application:
    name: schedula
  datasource:
    url: ${SCHEDULA_DB_URL:jdbc:postgresql://localhost:5432/schedula}
    username: ${SCHEDULA_DB_USER:schedula}
    password: ${SCHEDULA_DB_PASSWORD:schedula}
    hikari:
      maximum-pool-size: ${SCHEDULA_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      keepalive-time: 30000
      data-source-properties:
        options: "-c statement_timeout=5000"
        connectTimeout: 5
        socketTimeout: 120

---
spring:
  config:
    activate:
      on-role: scheduler
  datasource:
    hikari:
      maximum-pool-size: 5

---
spring:
  config:
    activate:
      on-role: worker
  datasource:
    hikari:
      maximum-pool-size: 15
  flyway:
    enabled: true

server:
  port: 8082
  tomcat:
    connection-timeout: 10s
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${SCHEDULA_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

schedula:
  auth:
    enabled: ${SCHEDULA_AUTH_ENABLED:true}
    admin-key: ${SCHEDULA_ADMIN_KEY:}
    default-tenant-key: ${SCHEDULA_DEFAULT_API_KEY:}
  roles:
    api: true
    scheduler: true
    worker: true
  scheduler:
    poll-interval-ms: 250
  recovery:
    sweep-interval-ms: 5000
    unhealthy-after-ms: 15000
    dead-after-ms: 60000
  coordinator:
    probe-interval-ms: 1000
    lease-ms: 15000
    node-port: ${server.port}
  queue:
    visibility-timeout-ms: 300000
    max-deliveries: 5
  worker:
    concurrency: 8
    batch-size: 16
    poll-interval-ms: 250
    heartbeat-interval-ms: 5000
    drain-deadline-ms: 30000
    capabilities: ""
    cpu-capacity: 0
    mem-capacity-mb: 0

logging:
  level:
    com.schedula: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [job=%X{job:-} exec=%X{exec:-}] %logger{20}: %msg%n"


